name: Build RDPScale

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/v*"
    tags: ["v*"]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/build.yml"
      - ".release-trigger"
  pull_request:
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Add licenses to distribution
        shell: pwsh
        run: |
          Copy-Item LICENSE build/out/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md build/out/THIRD_PARTY_NOTICES.md
          Get-ChildItem build/out

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDPScale-x64
          path: build/out/*
          retention-days: 7
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: build-x64
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: RDPScale-x64
          path: dist

      - name: Create release ZIP
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $tag = if ($refName.StartsWith("release/")) { $refName.Substring(8) } else { $refName }
          Compress-Archive -Path dist\* -DestinationPath "RDPScale-$tag-x64.zip" -CompressionLevel Optimal

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $refName = "${{ github.ref_name }}"
          $tag = if ($refName.StartsWith("release/")) { $refName.Substring(8) } else { $refName }
          $zip = "RDPScale-$tag-x64.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --target "${{ github.sha }}" --title "RDPScale $tag" --notes "First field-tested working release. Forces an independent effective DPI scale for the stock Windows mstsc.exe client using Microsoft Detours."
          }
